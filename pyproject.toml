[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-daily-brief"
version = "0.1.0"
description = "Personal daily AI intelligence brief"
requires-python = ">=3.11"
dependencies = ["certifi>=2024.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ai-brief = "ai_daily_brief.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
